<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МилаМанга — каталог</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="logo" href="#" id="logo">📖 МилаМанга</a>
    <nav class="menu" id="menu">
      <button data-view="catalog" class="active">Каталог</button>
      <button data-view="popular">Сейчас читают</button>
      <button data-view="updates">Обновления</button>
      <button data-view="news">Новости</button>
      <button data-view="genres">Жанры</button>
      <button data-view="bookmarks">🔖 Закладки <span id="bm-count" class="bm-count">0</span></button>
      <button data-view="random" class="random-btn">🎲 Случайный тайтл</button>
    </nav>
  </div>
</header>

<main>
  <div class="toolbar">
    <input id="search" type="search" placeholder="🔍 Поиск по названию или жанру…" autocomplete="off">
  </div>

  <div id="genres-row" class="chips"></div>

  <section id="news-block" class="news hidden">
    <h2>📰 Новости сайта</h2>
    <p>👋 Сайт открылся! Каталог пока заполнен образцами — скоро здесь появятся настоящие тайтлы.</p>
    <p>🔖 Теперь можно сохранять тайтлы в закладки — они хранятся в вашем браузере.</p>
  </section>

  <p id="empty" class="empty hidden">Ничего не найдено. Попробуйте другой запрос или сбросьте фильтр.</p>
  <div id="grid" class="grid"></div>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button id="modal-close" class="modal-close" aria-label="Закрыть">✕</button>
    <div id="modal-cover" class="modal-cover"></div>
    <h2 id="modal-title"></h2>
    <p id="modal-meta" class="meta"></p>
    <p id="modal-desc"></p>
    <button id="modal-bm" class="bm-btn"></button>
  </div>
</div>

<script src="titles.js"></script>
<script src="app.js"></script>
</body>
</html>
